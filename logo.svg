<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <rect x="14" y="14" width="172" height="172" rx="38" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Medical Cross & Leaf Icon -->
  <g transform="translate(100, 92)">
    <!-- Central Cross Base -->
    <path d="M-14,-42 L14,-42 L14,-14 L42,-14 L42,14 L14,14 L14,42 L-14,42 L-14,14 L-42,14 L-42,-14 L-14,-14 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Organic Homeopathic Leaf Accent -->
    <path d="M0,-38 C22,-38 38,-22 38,0 C38,22 22,38 0,38 C-8,24 -8,-24 0,-38 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M0,-30 Q16,-10 0,30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Star Accents -->
  <circle cx="45" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="155" cy="45" r="4" fill="#f59e0b"/>
</svg>
